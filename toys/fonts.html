<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clade: pixel fonts</title>
    <style>
      :root { --ink: #0d0a06; --outline: 2px 0 0 var(--ink), -2px 0 0 var(--ink), 0 2px 0 var(--ink), 0 -2px 0 var(--ink), 2px 2px 0 var(--ink); }
      body { margin: 0; padding: 12px; background: #16120d; color: #f3e9cc; font: 14px system-ui, sans-serif; }
      .bar { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
      .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 10px; }
      .f { background: #3a3023; border: 3px solid var(--ink); outline: 2px solid #b8913f; outline-offset: -5px; padding: 12px; font-synthesis: none; font-variant-ligatures: none; }
      .f.no { opacity: 0.55; }
      .f h3 { margin: 0 0 8px; font: 12px system-ui, sans-serif; color: #c2b08a; }
      .f p { margin: 3px 0; line-height: 1.25; }
      .t { font-size: 1.45em; color: #ff9a2e; text-shadow: var(--outline); }
      .g { color: #ffe033; text-shadow: var(--outline); font-size: 1.1em; }
      .d { color: #c2b08a; font-size: 0.85em; }
    </style>
  </head>
  <body>
    <div class="bar">
      <b>Pixel fonts, all free, on the game's panel with its outline</b>
      <label>size <input id="size" type="range" min="10" max="36" value="18" /> <span id="sv">18</span> px</label>
      <a href="./" style="color: #5ccbe8">back to the toys</a>
    </div>
    <div id="grid" class="grid"></div>
    <script>
      // [family, fontsource id, note]. All from Fontsource's CDN, one weight unless noted. Dim: already turned down.
      const FONTS = [
        ['Jersey 15', 'jersey-15', 'in the game now'], ['Jersey 10', 'jersey-10', ''], ['Jersey 20', 'jersey-20', ''], ['Jersey 25', 'jersey-25', ''],
        ['Handjet', 'handjet', 'has bold'], ['Bitcount Single', 'bitcount-single', 'has bold'], ['Doto', 'doto', 'has bold'], ['Geist Pixel', 'geist-pixel', ''],
        ['DotGothic16', 'dotgothic16', ''], ['Bytesized', 'bytesized', ''], ['Workbench', 'workbench', ''], ['Micro 5', 'micro-5', ''],
        ['Sixtyfour', 'sixtyfour', ''], ['Press Start 2P', 'press-start-2p', ''],
        ['Pixelify Sans', 'pixelify-sans', 'the old one', 1], ['Silkscreen', 'silkscreen', 'turned down', 1], ['Tiny5', 'tiny5', 'turned down', 1], ['VT323', 'vt323', 'turned down', 1],
      ];
      const url = (id) => `https://cdn.jsdelivr.net/fontsource/fonts/${id}@latest/latin-400-normal.woff2`;
      for (const [family, id] of FONTS) { const face = new FontFace(family, `url(${url(id)})`); face.load().then((f) => document.fonts.add(f)).catch(() => {}); }
      const grid = document.getElementById('grid');
      grid.innerHTML = FONTS.map(([family, , note, no]) => `<div class="f${no ? ' no' : ''}"><h3>${family}${note ? ` · ${note}` : ''}</h3><div style="font-family:'${family}'">
        <p class="t">Volcanic rock</p>
        <p class="g">Turn 12/20  Eggs 58  S A B C D F</p>
        <p>Next board: 20 mats · 1 buried · 6 shell beds · 5 prey · Anomalocaris on turn 4</p>
        <p>Vent surge on turns 8-10: warm water, oxygen falls everywhere.</p>
        <p class="d">Digging limb · upkeep 0 · your turn, every 2</p>
        <p class="d">5S 8B 0O 1lI  rn m  Haplophrentis, Wiwaxia, Burgessochaeta</p></div></div>`).join('');
      const size = document.getElementById('size'), sv = document.getElementById('sv');
      const set = () => { sv.textContent = size.value; grid.style.fontSize = size.value + 'px'; };
      size.oninput = set; set();
    </script>
  </body>
</html>
